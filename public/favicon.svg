<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1438"/>
      <stop offset="100%" stop-color="#0b0718"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="11" y="11" width="42" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  
  <line x1="25" y1="11" x2="25" y2="53" stroke="rgba(168,85,247,0.45)" stroke-width="1.2"/>
  <line x1="39" y1="11" x2="39" y2="53" stroke="rgba(168,85,247,0.45)" stroke-width="1.2"/>
  <line x1="11" y1="25" x2="53" y2="25" stroke="rgba(168,85,247,0.45)" stroke-width="1.2"/>
  <line x1="11" y1="39" x2="53" y2="39" stroke="rgba(168,85,247,0.45)" stroke-width="1.2"/>

  <g font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="18" font-size="11" fill="#38bdf8">5</text>
    <text x="46" y="18" font-size="11" fill="#c084fc">3</text>
    <text x="18" y="32" font-size="11" fill="#f472b6">7</text>
    <text x="46" y="32" font-size="11" fill="#fbbf24">1</text>
    <text x="32" y="46" font-size="11" fill="#38bdf8">9</text>
    <text x="46" y="46" font-size="11" fill="#f97316">6</text>
  </g>
</svg>
